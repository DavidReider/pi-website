<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Raspberry Pi Server</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0f172a;
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1rem 2rem;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.4rem;
        font-weight: bold;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }

      .hero {
        max-width: 700px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.2rem;
        color: #cbd5e1;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        padding: 0.9rem 1.8rem;
        background: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: 0.3s;
      }

      .button:hover {
        background: #2563eb;
      }

      footer {
        text-align: center;
        padding: 1rem;
        background: #1e293b;
        color: #94a3b8;
        border-top: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">🍓 Raspberry Pi</div>
        <div>Home</div>
      </nav>
    </header>

    <main>
      <div class="hero">
        <h1>Welcome to My Raspberry Pi Server</h1>
        <p>
          This website is hosted on a Raspberry Pi running in my home lab. It's
          a place for projects, experiments, and learning.
        </p>

        <a href="#" class="button">Explore</a>
      </div>
    </main>

    <footer>© 2026 DJ Reider</footer>
  </body>
</html>
