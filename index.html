<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON PI OS</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item"><span class="dot" id="apiDot"></span> CORE</div>
      <div class="hud-item">CPU <span id="hudCpu">--</span>°C</div>
      <div class="hud-item">LOAD <span id="hudLoad">--</span></div>
      <div class="hud-item">PING <span id="hudPing">--</span>ms</div>
    </div>

    <nav>
      <a href="#hero">HOME</a>
      <a href="#metrics">METRICS</a>
      <a href="#graph">GRAPH</a>
      <a href="#events">EVENTS</a>
      <a href="#control">CONTROL</a>
    </nav>

    <!-- HERO -->
    <section id="hero" class="hero">
      <div class="terminal">
        <div class="terminal-header">
          <span class="t-dot red"></span>
          <span class="t-dot yellow"></span>
          <span class="t-dot green"></span>
          <span class="terminal-title">NEON CORE</span>
        </div>

        <div class="hero-frame">
          <div class="hero-img" id="heroImg"></div>
          <div class="hero-overlay">
            <div class="hero-title">SYSTEM ACTIVE</div>
          </div>
        </div>
      </div>
    </section>

    <!-- METRICS -->
    <section id="metrics">
      <div class="section-title">SYSTEM METRICS</div>

      <div class="grid">
        <div class="card">
          <h3>CPU TEMP</h3>
          <div class="big" id="cpuText">--</div>
        </div>

        <div class="card">
          <h3>UPTIME</h3>
          <div class="big" id="uptimeText">--</div>
        </div>

        <div class="card">
          <h3>DISK</h3>
          <div class="big" id="diskText">--</div>
        </div>

        <div class="card">
          <h3>LOAD</h3>
          <div class="big" id="loadText">--</div>
        </div>
      </div>
    </section>

    <!-- GRAPH -->
    <section id="graph">
      <div class="section-title">CPU HISTORY</div>

      <div class="card">
        <canvas id="cpuGraph" width="900" height="200"></canvas>
      </div>
    </section>

    <!-- EVENTS -->
    <section id="events">
      <div class="section-title">SYSTEM EVENTS</div>

      <div class="card event-box" id="eventBox"></div>
    </section>

    <!-- CONTROL -->
    <section id="control">
      <div class="section-title">CONTROL</div>

      <div class="grid">
        <div class="card">
          <button onclick="restartApache()">Restart Apache</button>
        </div>
        <div class="card">
          <button onclick="rebootPi()">Reboot Pi</button>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
