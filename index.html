<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Neon Control Panel</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!-- SCANLINES -->
    <div class="scanlines"></div>

    <!-- NAV -->
    <nav>
      <a href="#home">Home</a>
      <a href="#metrics">Metrics</a>
      <a href="#status">Status</a>
    </nav>

    <!-- HERO -->
    <section class="hero" id="home">
      <div class="hero-frame">
        <div class="hero-img" id="heroImg"></div>
        <div class="hero-overlay"></div>

        <div class="hero-text">
          <div class="hero-title" id="heroTitle">NEON SYSTEM ONLINE</div>
          <div class="hero-sub">Raspberry Pi Control Interface</div>
        </div>
      </div>
    </section>

    <!-- METRICS -->
    <section id="metrics">
      <div class="section-title">System Metrics</div>

      <div class="grid">
        <div class="card" id="cpuCard">
          <h3>CPU Temperature</h3>
          <div class="meter">
            <div id="cpuBar" class="bar"></div>
          </div>
          <div id="cpuText">--°C</div>
        </div>

        <div class="card">
          <h3>Uptime</h3>
          <div id="uptimeText">--</div>
        </div>

        <div class="card">
          <h3>Disk Usage</h3>
          <div class="meter">
            <div id="diskBar" class="bar"></div>
          </div>
          <div id="diskText">--</div>
        </div>

        <div class="card">
          <h3>Load Average</h3>
          <div id="loadText">--</div>
        </div>
      </div>
    </section>

    <!-- STATUS -->
    <section id="status">
      <div class="section-title">System Status</div>

      <div class="grid">
        <div class="card">
          <h3>Web Server</h3>
          <div>Apache Running</div>
        </div>

        <div class="card">
          <h3>Deploy System</h3>
          <div>GitHub Runner Active</div>
        </div>

        <div class="card">
          <h3>System</h3>
          <div>Pi Online</div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
